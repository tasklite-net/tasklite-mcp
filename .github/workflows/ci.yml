name: CI

# The repo had no CI: a PR was tested only on the author's machine. Every PR
# and every push to main now builds and runs the offline tool tests (no
# network, no key: test/tools.test.mjs runs against a fake API).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
